{
  "app": {
    "name": "data-pipeline-failure-rca-agent",
    "environment": "local"
  },
  "provider": {
    "name": "mock",
    "model": "mock-v1",
    "timeout_seconds": 30,
    "max_retries": 2
  },
  "workflow": {
    "stages": [
      "ingest_incident_context",
      "normalize_logs_and_events",
      "extract_error_signatures",
      "generate_competing_hypotheses",
      "collect_supporting_and_disconfirming_evidence",
      "rank_root_causes",
      "estimate_blast_radius",
      "propose_remediation",
      "generate_validation_and_rollback_plan"
    ],
    "checkpoint_each_stage": true,
    "state_directory": "out/state"
  },
  "risk": {
    "default_approval_threshold": "HIGH"
  },
  "approval": {
    "mode": "manual",
    "required_for_mutations": true
  },
  "observability": {
    "log_level": "INFO",
    "structured": true
  },
  "tools": {
    "mode": "fake",
    "allow_mutations": false
  }
}
